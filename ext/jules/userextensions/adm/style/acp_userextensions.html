<!-- IF U_USER_ADMIN -->
<div class="panel bg2">
    <div class="inner">
        <h3>{L_USER_BADGES}</h3>
        <p>{L_USER_BADGES_EXPLAIN}</p>
        <fieldset class="fields2">
            <dl>
                <dt><label for="badge_name">{L_BADGE_NAME}:</label></dt>
                <dd><input type="text" name="badge_name" id="badge_name" class="inputbox" /></dd>
            </dl>
            <dl>
                <dt><label for="badge_image">{L_BADGE_IMAGE}:</label></dt>
                <dd><input type="text" name="badge_image" id="badge_image" class="inputbox" /></dd>
            </dl>
        </fieldset>
        <fieldset class="quick">
            <input type="submit" name="add_badge" value="{L_ADD_BADGE}" class="button2" />
        </fieldset>
    </div>
</div>
<!-- ENDIF -->

<!-- IF S_USER_BADGES -->
<div class="panel bg1">
    <div class="inner">
        <h3>{L_USER_BADGES}</h3>
        <ul class="badgelist">
            <!-- BEGIN user_badges -->
            <li><img src="{user_badges.BADGE_IMAGE}" alt="{user_badges.BADGE_NAME}" title="{user_badges.BADGE_NAME}" /></li>
            <!-- END user_badges -->
        </ul>
    </div>
</div>
<!-- ENDIF -->

<!-- IF S_USER_COVER_IMAGE -->
<div class="panel bg1">
    <div class="inner">
        <h3>{L_PROFILE_COVER}</h3>
        <img src="{USER_COVER_IMAGE}" alt="{L_PROFILE_COVER}" style="max-width: 100%;" />
    </div>
</div>
<!-- ENDIF -->
